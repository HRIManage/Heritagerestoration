<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Correct viewport: allow user scaling (accessibility + iOS best practice) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO tags (title, meta description, canonical, robots, Open Graph, Twitter)
         are set per-page at runtime via react-helmet-async / <SEOHead>. They are
         intentionally NOT declared here: the Helmet build in use appends rather
         than replaces, so any copy in this file becomes a duplicate on every
         route (two <title>, two descriptions, two of every OG tag, etc.).
         A build-time prerender step would let these move back into static HTML. -->

    <!-- Favicon (drop favicon.png into /public to activate) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#8DBD42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Heritage Restoration" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Sitemap & AI discovery -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms.txt"
      title="AI/LLM site summary"
    />

    <!-- Performance: preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->

      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap"

    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
